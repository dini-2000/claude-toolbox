<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvest Supper poster</title>
<link rel="stylesheet" href="../../engine/core.css">
<link rel="stylesheet" href="../../themes/risograph/tokens.css">
<link rel="stylesheet" href="../../themes/risograph/theme.css">
<script src="../../icons/lucide.js"></script>
</head>
<body>
<div class="pc-deck" data-theme="risograph" data-format="a4p" data-medium="graphic" data-motion="static" data-title="Harvest Supper poster">

<section class="pc-slide pc-cover" style="--k-hero: 1.9; --cover-w: 100%">
  <p class="pc-kicker">Members and neighbours</p>
  <h1 class="pc-title">Harvest Supper</h1>
  <p class="pc-sub">A long table in the big shed, cooked from this year's plots</p>
  <div class="pc-row" style="align-items: end; gap: 64px; margin-top: 56px">
    <div class="pc-contact" style="margin-top: 0; flex-direction: column">
      <div><b>When</b>Saturday 7 November, 6 pm</div>
      <div><b>Where</b>Mill Lane gate, behind the library</div>
      <div><b>Tickets</b>$12, children free</div>
    </div>
    <figure class="pc-qr" style="--qr-size: 300px"><img class="pc-qr-code" data-qr="https://northside-garden.example/supper" alt="Book a place at northside-garden.example/supper"><figcaption>Scan to book</figcaption></figure>
  </div>
</section>

</div>
<script src="../../engine/runtime.js"></script>
</body>
</html>
